<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee Profile | Popular Diagnostics</title><style>body{margin:0;background:#f5f8fc;color:#102a43;font:16px system-ui,sans-serif}.top{padding:20px 7%;background:#102a43;color:#fff;font-weight:800}.top span{color:#6ee7c8}.box{max-width:460px;margin:60px auto;background:#fff;border:1px solid #dce5ef;border-radius:16px;padding:28px}input{width:100%;padding:12px;margin:8px 0 14px;border:1px solid #b8c8d8;border-radius:8px;box-sizing:border-box;font:inherit}button{padding:12px 16px;border:0;border-radius:8px;background:#1363df;color:#fff;font-weight:750;cursor:pointer}</style></head><body><header class="top">Popular<span>Diagnostics</span> · Employee Profile</header><main class="box"><h1>Open your profile</h1><p>Enter the Employee ID generated during registration.</p><input id="employeeId" placeholder="Example: PD-53C64159"><button onclick="openProfile()">View profile</button><p id="error" style="color:#b42318"></p></main><script>function openProfile(){const id=document.querySelector('#employeeId').value.trim();if(!id){error.textContent='Enter your Employee ID.';return}window.location.href='/employees/'+encodeURIComponent(id)+'/profile/'}</script></body></html>
