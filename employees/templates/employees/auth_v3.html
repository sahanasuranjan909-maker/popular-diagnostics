<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee Access | Popular Diagnostics</title><style>body{margin:0;background:#f5f8fc;color:#102a43;font:16px system-ui,sans-serif}.top{padding:22px 7%;background:#102a43;color:#fff;font-weight:800}.top span{color:#6ee7c8}.wrap{max-width:760px;margin:50px auto;padding:0 20px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#fff;border:1px solid #dce5ef;border-radius:16px;padding:24px}h1{margin-top:0}label{display:block;margin-top:12px;font-weight:700}input{width:100%;margin-top:6px;padding:11px;border:1px solid #b8c8d8;border-radius:8px;box-sizing:border-box;font:inherit}button{width:100%;margin-top:17px;padding:12px;border:0;border-radius:8px;background:#1363df;color:#fff;font-weight:750;cursor:pointer}.error{background:#fff0f0;color:#b42318;padding:10px;border-radius:8px;margin-bottom:15px}@media(max-width:680px){.cards{grid-template-columns:1fr}}</style></head><body><header class="top">Popular<span>Diagnostics</span> · Employee access</header><main class="wrap"><h1>Employee access</h1>{% if error %}<div class="error">{{ error }}</div>{% endif %}<section class="cards"><form class="card" method="post"><h2>Existing employee</h2><p>Log in to open your collection dashboard.</p>{% csrf_token %}<input type="hidden" name="action" value="login"><label>Username or Employee ID<input name="username" required></label><label>Password<input type="password" name="password" required></label><button>Log in</button></form><form class="card" method="post"><h2>New employee</h2><p>All details, including your service PIN code, are required.</p>{% csrf_token %}<input type="hidden" name="action" value="register"><label>Full name<input name="full_name" required></label><label>Phone number<input name="phone" required></label><label>Employee PIN code<input name="pin_code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label><label>Email address<input type="email" name="email" required></label><label>Username<input name="username" required></label><label>Password<input type="password" name="password" maxlength="8" required></label><button>Create employee account</button></form></section></main></body></html>
