<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Official Login | Popular Diagnostics</title><style>body{margin:0;background:#f5f8fc;color:#102a43;font:16px system-ui,sans-serif}.top{padding:22px 7%;background:#102a43;color:#fff;font-weight:800}.top span{color:#6ee7c8}.box{max-width:430px;margin:70px auto;background:#fff;border:1px solid #dce5ef;border-radius:16px;padding:28px}label{display:block;margin-top:14px;font-weight:700}input{width:100%;margin-top:6px;padding:12px;border:1px solid #b8c8d8;border-radius:8px;box-sizing:border-box;font:inherit}button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:8px;background:#1363df;color:#fff;font-weight:750;cursor:pointer}.error{background:#fff0f0;color:#b42318;padding:10px;border-radius:8px}</style></head><body><header class="top">Popular<span>Diagnostics</span> · Officials</header><main class="box"><h1>Official login</h1><p>Authorised staff can manage employees, customer requests, and payouts.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post">{% csrf_token %}<label>Official username<input name="username" required></label><label>Password<input type="password" name="password" required></label><button>Login to official dashboard</button></form></main></body></html>
