<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Post Collection | Popular Diagnostics</title><style>body{margin:0;background:#f5f8fc;color:#102a43;font:16px system-ui,sans-serif}.top{padding:22px 7%;background:#102a43;color:#fff;font-weight:800}.top span{color:#6ee7c8}.box{max-width:620px;margin:45px auto;background:#fff;border:1px solid #dce5ef;border-radius:16px;padding:28px}label{display:block;margin-top:14px;font-weight:700}input,select{width:100%;margin-top:6px;padding:11px;border:1px solid #b8c8d8;border-radius:8px;box-sizing:border-box;font:inherit}button,a{display:inline-block;margin-top:20px;padding:12px 16px;border:0;border-radius:8px;background:#1363df;color:#fff;font-weight:750;text-decoration:none;cursor:pointer}.message{background:#e9fff7;color:#076545;padding:11px;border-radius:8px}</style></head><body><header class="top">Popular<span>Diagnostics</span> · Officials</header><main class="box"><h1>Post customer collection</h1><p>New requests will appear in the employee dashboard.</p>{% if message %}<div class="message">{{ message }}</div>{% endif %}<form method="post">{% csrf_token %}<label>Customer name<input name="customer_name" required></label><label>Collection address<input name="address" required placeholder="Full address"></label><label>PIN code<input name="pin_code" pattern="[0-9]{6}" maxlength="6" required></label><label>Collection type<select name="collection_type"><option>Routine blood work</option><option>Fasting sample</option><option>Urgent collection</option></select></label><label>Official payout amount<input type="number" name="payout_amount" min="0" step="0.01" required></label><button>Post for employees</button></form><br><a href="/official/dashboard/">Back to dashboard</a></main></body></html>
