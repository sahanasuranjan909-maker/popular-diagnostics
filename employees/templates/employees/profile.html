{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee Profile | Popular Diagnostics</title><link rel="stylesheet" href="{% static 'employees/css/dashboard.css' %}"><style>.profile{max-width:560px;margin:40px auto;background:#fff;border:1px solid #dce5ef;border-radius:16px;padding:26px}.avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;background:#e8f0ff;display:block;margin-bottom:14px}.profile input{width:100%;margin:6px 0 14px;padding:11px;border:1px solid #b8c8d8;border-radius:8px;box-sizing:border-box;font:inherit}.profile button{border:0;border-radius:8px;padding:12px 16px;background:#1363df;color:#fff;font-weight:750;cursor:pointer}</style></head><body><header class="top"><div class="brand">Popular<span>Diagnostics</span></div><div>Employee profile</div></header><main class="profile"><h1>Your profile</h1>{% if employee.profile_picture %}<img class="avatar" src="{{ employee.profile_picture.url }}" alt="Profile picture">{% else %}<div class="avatar"></div>{% endif %}<p><b>Employee ID:</b> {{ employee.employee_id }}</p><form method="post" enctype="multipart/form-data">{% csrf_token %}<label>Profile picture<input type="file" name="profile_picture" accept="image/*"></label><label>Full name<input name="full_name" value="{{ employee.full_name }}" required></label><label>Phone<input name="phone" value="{{ employee.phone }}" required></label><label>Email<input type="email" name="email" value="{{ employee.email }}"></label><button type="submit">Save profile</button></form></main></body></html>
